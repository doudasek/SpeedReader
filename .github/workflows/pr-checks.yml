name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request cancels its previous run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  spotless:
    name: Spotless
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew spotlessCheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleDebug

  unit-tests:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :koverXmlReportCoverage :koverHtmlReportCoverage
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/testDebugUnitTest/"
      # Only comments on the PR; the threshold itself is enforced by koverVerifyCoverage in build.gradle.kts.
      - if: github.event_name == 'pull_request'
        uses: mi-kas/kover-report@v2.7
        with:
          path: ${{ github.workspace }}/build/reports/kover/reportCoverage.xml
          title: Code coverage
          update-comment: true
          min-coverage-overall: 80
          coverage-counter-type: LINE
      - run: ./gradlew :koverVerifyCoverage
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: build/reports/kover/

  # Reference images are recorded on macOS; layoutlib font rendering differs on Linux.
  screenshot-tests:
    name: Screenshot tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew validateDebugScreenshotTest
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: screenshot-test-reports
          path: |
            **/build/reports/screenshotTest/
            **/build/outputs/screenshotTest-results/
